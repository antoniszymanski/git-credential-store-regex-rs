[package]
name = "git-credential-store-regex"
version = "0.4.2"
edition = "2024"
description = "A Git credential helper that provides credentials by matching attributes against regular expressions"
repository = "https://github.com/antoniszymanski/git-credential-store-regex-rs"
license = "MPL-2.0"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
dirs = "6.0.0"
gitcredential = { version = "0.1.1", default-features = false }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_path_to_error = "0.1.20"
serde_with = "3.18.0"
snafu = "0.9.0"

[build-dependencies]
carapace_spec_clap = "1.2.3"
clap = { version = "4.6.0", features = ["derive"] }
clap_complete = "4.6.9"
clap_complete_nushell = "4.6.2"
clap_mangen = "0.3.3"
remove_dir_all = "1.0.0"

[profile.release]
lto = true
codegen-units = 1
